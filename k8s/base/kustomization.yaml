apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: healthqueue

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: healthqueue
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

# The image Argo CD deploys. CI (.github/workflows/ci.yml) publishes
# ghcr.io/katie-csp/cst365_week7 with tags `latest` and `sha-<commit>`.
# To release a specific build, change newTag to `sha-<commit>` in a PR;
# Argo CD deploys it once the PR is merged to main.
images:
  - name: healthqueue-api
    newName: ghcr.io/katie-csp/cst365_week7
    newTag: latest

# Internal-only service (ClusterIP). Use `kubectl port-forward` to reach it locally.
apiVersion: v1
kind: Service
metadata:
  name: healthqueue-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: healthqueue-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
